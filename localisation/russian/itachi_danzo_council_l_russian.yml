l_russian:
 # Итачи
 itachi.1.t:0 "Итачи Учиха"
 itachi.1.d:0 "Саске наконец нашёл своего брата Итачи. Что он выберет?"
 itachi.1.a:0 "Убить Итачи"
 itachi.1.b:0 "Узнать правду и пощадить"
 itachi.1.c:0 "Итачи побеждает"

 itachi.2.t:0 "Смерть Итачи"
 itachi.2.d:0 "Итачи Учиха мёртв. Саске отомстил за клан."
 itachi.2.a:0 "Почтить память"
 itachi.2.b:0 "Раскрыть правду"

 itachi.3.t:0 "Итачи жив"
 itachi.3.d:0 "Итачи раскрыл правду о клане Учиха. Он хочет помочь Саске."
 itachi.3.a:0 "Итачи — советник"
 itachi.3.b:0 "Итачи — военный лидер"
 itachi.3.c:0 "Создать триумвират"

 itachi.4.t:0 "Саске пленён"
 itachi.4.d:0 "Итачи одолел Саске. Что он сделает с братом?"
 itachi.4.a:0 "Вернуть Саске в Коноху"
 itachi.4.b:0 "Итачи — лидер Конохи"

 itachi.5.t:0 "Триумвират"
 itachi.5.desc:0 "Саске и Итачи создают триумвират. Кто станет третьим?"
 itachi.5.a:0 "Какаши — военный лидер"
 itachi.5.b:0 "Наруто — духовный лидер"
 itachi.5.c:0 "Сакура — медицинский лидер"
 itachi.5.d:0 "Хокаге — официальный лидер"

 itachi.6.t:0 "Кризис триумвирата"
 itachi.6.d:0 "Обито сеет раздор между членами триумвирата."
 itachi.6.a:0 "Итачи раскрывает план Обито"
 itachi.6.b:0 "Итачи уходит из триумвирата"
 itachi.6.c:0 "Итачи жертвует собой"

 # Данзо
 danzo.1.t:0 "Данзо использует Изанаги"
 danzo.1.d:0 "Данзо активирует запретные техники Учиха."
 danzo.1.a:0 "Изанаги — выжить"
 danzo.1.b:0 "Конохамацуками — контроль над Каге"
 danzo.1.c:0 "Данзо раскрыт"

 danzo.2.t:0 "Суд над Данзо"
 danzo.2.d:0 "Данзо свергнут. Что с ним делать?"
 danzo.2.a:0 "Казнить"
 danzo.2.b:0 "Изгнать"

 danzo.3.t:0 "Данзо против Саске"
 danzo.3.d:0 "Саске настиг Данзо. Битва неизбежна."
 danzo.3.a:0 "Изанаги — Данзо выживает"
 danzo.3.b:0 "Данзо убит"
 danzo.3.c:0 "Данзо бежит к Орочимару"

 danzo.4.t:0 "Возвращение Данзо"
 danzo.4.d:0 "Данзо скрывался. Теперь он готов действовать снова."
 danzo.4.a:0 "Данзо пытается вернуть власть"
 danzo.4.b:0 "Данзо исчезает навсегда"

