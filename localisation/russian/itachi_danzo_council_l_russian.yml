 kage_council_permanent.1.a:0 "Поддержать решения"
 kage_council_permanent.1.b:0 "Продвинуть свои интересы"

 kage_council_permanent.2.t:0 "Кризис в Совете"
 kage_council_permanent.2.d:0 "Внутри Совета назрел конфликт."
 kage_council_permanent.2.a:0 "Дипломатия"
 kage_council_permanent.2.b:0 "Обострить конфликт"
 kage_council_permanent.2.c:0 "Выйти из Совета"

 kage_council_permanent.3.t:0 "Укрепить Совет?"
 kage_council_permanent.3.d:0 "Голосование об укреплении Совета."
 kage_council_permanent.3.a:0 "Укрепить"
 kage_council_permanent.3.b:0 "Оставить как есть"

 kage_council_permanent.100.t:0 "Совет распущен"
 kage_council_permanent.100.d:0 "Совет Пяти Каге распущен."
 kage_council_permanent.100.a:0 "Мы вышли"

