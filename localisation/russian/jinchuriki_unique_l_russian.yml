l_russian:
 jinchuriki:0 "Дзинчурики"
 jinchuriki_desc:0 "Уникальная боевая единица — живое воплощение хвостатого зверя. НЕ подлежит производству, НЕ может быть создана или расформирована игроком."
 juubi_jinchuriki:0 "Дзинчурики Джуби"
 juubi_jinchuriki_desc:0 "Носитель Десятихвостого зверя. Абсолютная сила, доступная только Мадаре Учихе."

 bijuu_extraction.1.t:0 "Извлечение хвостатого"
 bijuu_extraction.1.d:0 "Акацуки извлекли зверя из дзинчурики. Хозяин погибает, дивизия уничтожена."
 bijuu_extraction.1.a:0 "Зверь извлечён"

 bijuu_extraction.100.t:0 "Мадара — дзинчурики Джуби"
 bijuu_extraction.100.d:0 "Мадара Учиха поглотил Десятихвостого. На поле боя появился бог."
 bijuu_extraction.100.a:0 "Началась новая эра"

 extract_bijuu:0 "Извлечь зверя"
 extract_bijuu_desc:0 "Провести ритуал извлечения хвостатого из захваченного дзинчурики. Хозяин погибает."