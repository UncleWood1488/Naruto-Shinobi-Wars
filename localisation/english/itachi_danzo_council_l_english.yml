 itachi.1.t:0 "Itachi Uchiha"
 itachi.1.d:0 "Sasuke has finally found his brother Itachi. What will he choose?"
 itachi.1.a:0 "Kill Itachi"
 itachi.1.b:0 "Learn the truth and spare him"
 itachi.1.c:0 "Itachi prevails"

 itachi.2.t:0 "Itachi's Death"
 itachi.2.d:0 "Itachi Uchiha is dead. Sasuke has avenged the clan."
 itachi.2.a:0 "Honor his memory"
 itachi.2.b:0 "Reveal the truth"

 itachi.3.t:0 "Itachi Lives"
 itachi.3.d:0 "Itachi has revealed the truth about the Uchiha clan. He wants to help Sasuke."
 itachi.3.a:0 "Itachi as advisor"
 itachi.3.b:0 "Itachi as military leader"
 itachi.3.c:0 "Form a triumvirate"

 itachi.4.t:0 "Sasuke Captured"
 itachi.4.d:0 "Itachi has defeated Sasuke. What will he do with his brother?"
 itachi.4.a:0 "Return Sasuke to Konoha"
 itachi.4.b:0 "Itachi as leader of Konoha"

 itachi.5.t:0 "The Triumvirate"
 itachi.5.desc:0 "Sasuke and Itachi form a triumvirate. Who will be the third?"
 itachi.5.a:0 "Kakashi — military leader"
 itachi.5.b:0 "Naruto — spiritual leader"
 itachi.5.c:0 "Sakura — medical leader"
 itachi.5.d:0 "Hokage — official leader"

 itachi.6.t:0 "Triumvirate Crisis"
 itachi.6.d:0 "Obito sows discord among the triumvirate members."
 itachi.6.a:0 "Itachi exposes Obito's plan"
 itachi.6.b:0 "Itachi leaves the triumvirate"
 itachi.6.c:0 "Itachi sacrifices himself"

 danzo.1.t:0 "Danzo Uses Izanagi"
 danzo.1.d:0 "Danzo activates forbidden Uchiha techniques."
 danzo.1.a:0 "Izanagi — survive"
 danzo.1.b:0 "Kotoamatsukami — control over the Kage"
 danzo.1.c:0 "Danzo is exposed"

 danzo.2.t:0 "Danzo's Trial"
 danzo.2.d:0 "Danzo has been overthrown. What shall be done with him?"
 danzo.2.a:0 "Execute"
 danzo.2.b:0 "Exile"

 danzo.3.t:0 "Danzo vs Sasuke"
 danzo.3.d:0 "Sasuke has caught up with Danzo. The battle is inevitable."
 danzo.3.a:0 "Izanagi — Danzo survives"
 danzo.3.b:0 "Danzo is killed"
 danzo.3.c:0 "Danzo flees to Orochimaru"

 danzo.4.t:0 "Danzo Returns"
 danzo.4.d:0 "Danzo has been in hiding. Now he is ready to act again."
 danzo.4.a:0 "Danzo tries to reclaim power"
 danzo.4.b:0 "Danzo disappears forever"

